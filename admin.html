<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>لوحة التحكم | صيدلية المجيدي</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dark-mode.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="icon" href="images/logo.png" />
</head>
<body class="admin-body">

  <!-- شاشة الدخول -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div class="login-logo">🔐</div>
      <h1>لوحة التحكم</h1>
      <p>صيدلية المجيدي</p>
      <form id="loginForm">
        <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" required autocomplete="off" />
        <button type="submit" class="btn btn-primary btn-block">دخول</button>
        <p class="login-error" id="loginError"></p>
      </form>
      <a href="index.html" class="back-link">← العودة للموقع</a>
    </div>
  </div>

  <!-- لوحة التحكم -->
  <div class="admin-panel" id="adminPanel" style="display:none;">

    <header class="admin-header">
      <div class="admin-header-inner">
        <h1>📋 إدارة صيدلية المجيدي</h1>
        <div class="admin-actions">
          <button id="soundToggleBtn" class="icon-btn" title="التنبيه الصوتي">🔔</button>
          <button id="darkBtn" class="icon-btn" title="الوضع الليلي">🌙</button>
          <button id="logoutBtn" class="btn btn-outline btn-sm">خروج</button>
        </div>
      </div>
    </header>

    <!-- التبويبات (Tabs) -->
    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="tab-orders">📦 الطلبات</button>
      <button class="tab-btn" data-tab="tab-inventory">📊 المخزون</button>
      <button class="tab-btn" data-tab="tab-suppliers">🚚 طلبات الشركات</button>
    </div>

    <div class="admin-container">
      
      <!-- ==================== تبويب الطلبات ==================== -->
      <div id="tab-orders" class="tab-content active">
        <div class="stats-grid">
          <div class="stat-card"><span class="stat-num" id="statTotal">0</span><span class="stat-label">إجمالي الطلبات</span></div>
          <div class="stat-card pending"><span class="stat-num" id="statPending">0</span><span class="stat-label">قيد الانتظار</span></div>
          <div class="stat-card preparing"><span class="stat-num" id="statPreparing">0</span><span class="stat-label">قيد التجهيز</span></div>
          <div class="stat-card done"><span class="stat-num" id="statDone">0</span><span class="stat-label">تم التسليم</span></div>
        </div>

        <div class="admin-toolbar">
          <input type="text" id="searchInput" placeholder="🔍 ابحث بالاسم أو الجوال..." />
          <select id="filterStatus">
            <option value="all">كل الحالات</option>
            <option value="قيد الانتظار">قيد الانتظار</option>
            <option value="قيد التجهيز">قيد التجهيز</option>
            <option value="جاهز للاستلام">جاهز للاستلام</option>
            <option value="تم التسليم">تم التسليم</option>
            <option value="ملغي">ملغي</option>
          </select>
        </div>

        <div id="ordersContainer"></div>
      </div>

      <!-- ==================== تبويب المخزون ==================== -->
      <div id="tab-inventory" class="tab-content">
        <div class="admin-toolbar">
          <input type="text" id="searchInventory" placeholder="🔍 ابحث عن دواء..." />
          <button id="addInventoryBtn" class="btn btn-primary btn-sm">➕ إضافة دواء للمخزون</button>
        </div>
        
        <div id="inventoryForm" style="display:none; background:var(--bg); padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid var(--border);">
          <h3 style="margin-bottom:10px;">إضافة / تعديل دواء</h3>
          <input type="hidden" id="editInvIndex" value="-1">
          <input type="text" id="invName" placeholder="اسم الدواء (مثال: بنادول)" style="width:100%; padding:8px; margin-bottom:8px; border-radius:6px; border:1px solid var(--border);">
          <div style="display:flex; gap:10px;">
            <input type="number" id="invQty" placeholder="الكمية الكلية" style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--border);">
            <input type="number" id="invSold" placeholder="المباع" style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--border);">
          </div>
          <div style="margin-top:10px; display:flex; gap:10px;">
            <button id="saveInvBtn" class="btn btn-primary btn-sm">حفظ</button>
            <button id="cancelInvBtn" class="btn btn-outline btn-sm">إلغاء</button>
          </div>
        </div>

        <div id="inventoryContainer" style="overflow-x:auto;"></div>
      </div>

      <!-- ==================== تبويب طلبات الشركات ==================== -->
      <div id="tab-suppliers" class="tab-content">
        <div class="admin-toolbar">
          <button id="addSupplierBtn" class="btn btn-primary btn-sm">➕ إضافة طلب شراء</button>
        </div>

        <div id="supplierForm" style="display:none; background:var(--bg); padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid var(--border);">
          <h3 style="margin-bottom:10px;">طلب من شركة</h3>
          <input type="text" id="supName" placeholder="اسم الدواء والنوع" style="width:100%; padding:8px; margin-bottom:8px; border-radius:6px; border:1px solid var(--border);">
          <div style="display:flex; gap:10px;">
            <input type="number" id="supQty" placeholder="العدد المطلوب" style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--border);">
            <input type="date" id="supDate" style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--border);">
          </div>
          <div style="margin-top:10px; display:flex; gap:10px;">
            <button id="saveSupBtn" class="btn btn-primary btn-sm">حفظ الطلب</button>
            <button id="cancelSupBtn" class="btn btn-outline btn-sm">إلغاء</button>
          </div>
        </div>

        <div id="suppliersContainer" style="overflow-x:auto;"></div>
      </div>

    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
