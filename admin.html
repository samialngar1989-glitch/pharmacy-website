<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | صيدلية المجيدي</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dark-mode.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="icon" href="images/logo.png" />
</head>
<body class="admin-body">

  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div class="login-logo">🔐</div>
      <h1>لوحة التحكم</h1>
      <form id="loginForm">
        <input type="password" id="passwordInput" placeholder="كلمة المرور" required />
        <button type="submit" class="btn btn-primary btn-block">دخول</button>
        <p class="login-error" id="loginError"></p>
      </form>
    </div>
  </div>

  <div class="admin-panel" id="adminPanel" style="display:none;">
    <header class="admin-header">
      <div class="admin-header-inner">
        <h1>📋 إدارة صيدلية المجيدي</h1>
        <div class="admin-actions">
          <button id="darkBtn" class="icon-btn">🌙</button>
          <button id="logoutBtn" class="btn btn-outline btn-sm">خروج</button>
        </div>
      </div>
    </header>

    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="tab-orders">📦 الطلبات</button>
      <button class="tab-btn" data-tab="tab-inventory">📊 المخزون</button>
      <button class="tab-btn" data-tab="tab-suppliers">🚚 طلبات الشركات</button>
    </div>

    <div class="admin-container">
      <!-- الطلبات -->
      <div id="tab-orders" class="tab-content active">
        <div class="stats-grid">
          <div class="stat-card"><span class="stat-num" id="statTotal">0</span><span class="stat-label">إجمالي الطلبات</span></div>
          <div class="stat-card pending"><span class="stat-num" id="statPending">0</span><span class="stat-label">قيد الانتظار</span></div>
          <div class="stat-card preparing"><span class="stat-num" id="statPreparing">0</span><span class="stat-label">قيد التجهيز</span></div>
          <div class="stat-card done"><span class="stat-num" id="statDone">0</span><span class="stat-label">تم التسليم</span></div>
        </div>
        <div class="admin-toolbar">
          <input type="text" id="searchInput" placeholder="🔍 ابحث بالاسم أو الجوال..." />
          <select id="filterStatus">
            <option value="all">كل الحالات</option>
            <option value="قيد الانتظار">قيد الانتظار</option>
            <option value="قيد التجهيز">قيد التجهيز</option>
            <option value="تم التسليم">تم التسليم</option>
          </select>
          <!-- زر تحديث الشريط الإعلاني -->
          <button id="whatsappCampaignBtn" class="btn btn-primary btn-sm" style="background:#f59e0b; border-color:#f59e0b;">📢 تحديث الشريط الإعلاني</button>
        </div>
        <div id="ordersContainer"></div>
      </div>

      <!-- المخزون -->
      <div id="tab-inventory" class="tab-content">
        <div class="admin-toolbar">
          <button id="refreshInventoryBtn" class="btn btn-primary btn-sm">🔄 تحديث المخزون</button>
        </div>
        
        <!-- تنبيه الصلاحية -->
        <div id="expiryWarningBox" style="display:none; background:#fee2e2; color:#991b1b; padding:15px; border-radius:8px; margin-bottom:15px;">
          <h3>⚠️ تنبيهات الصلاحية (تنتهي خلال 3 أشهر):</h3>
          <ul id="expiryWarningList" style="padding-right: 20px; margin-top: 10px;"></ul>
        </div>

        <div id="inventoryContainer" style="overflow-x:auto;"></div>
      </div>

      <!-- الشركات -->
      <div id="tab-suppliers" class="tab-content">
        <div class="admin-toolbar">
          <button id="refreshSupBtn" class="btn btn-primary btn-sm">🔄 تحديث طلبات الشركات</button>
        </div>
        <p style="font-size: 0.9rem; color: gray; margin-bottom: 15px;">
          * ملاحظة: يتم إضافة طلبات الشركات مباشرة من خلال ملف Google Sheets (ورقة Suppliers).
        </p>
        <div id="suppliersContainer" style="overflow-x:auto;"></div>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
